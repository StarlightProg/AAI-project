name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: cd /tmp && traceguard smoke
      - run: >-
          cd /tmp && python -c
          "from traceguard.experiments import default_ablations_path, load_ablations;
          from traceguard.sandbox.config import default_sandbox_configuration_path,
          load_sandbox_configuration;
          load_ablations(default_ablations_path());
          load_sandbox_configuration(default_sandbox_configuration_path())"
